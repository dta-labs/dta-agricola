<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>smoke - logica en navegador</title>
</head>
<body>
<!-- Prueba de humo de los modulos de logica EN UN NAVEGADOR REAL, sin dependencias.
     Ejecutar:  chrome --headless=new --dump-dom http://127.0.0.1:8090/test/smoke.html
     La pagina imprime PASS/FAIL en #salida, asi que se puede comprobar con una busqueda. -->
<div id="salida">sin ejecutar</div>

<script src="../assets/js/logic/formulas.js"></script>
<script src="../assets/js/logic/fechas.js"></script>
<script src="../assets/js/logic/secuencias.js"></script>
<script src="../assets/js/logic/estado.js"></script>
<script src="../assets/js/logic/ids.js"></script>
<script src="../assets/js/logic/riego.js"></script>
<script src="../assets/js/logic/equipos.js"></script>
<script src="../assets/js/services/repositorio.js"></script>
<script src="../assets/js/services/autenticacion.js"></script>
<script src="../assets/js/services/equipos.js"></script>

<script>
  var resultados = [];
  function ok(nombre, condicion) {
    resultados.push((condicion ? "PASS " : "FAIL ") + nombre);
  }

  ok("DTALogic expuesto por los <script>", typeof DTALogic === "object" && DTALogic !== null);
  ok("5 modulos cargados", ["formulas", "fechas", "secuencias", "estado", "ids"].every(function (k) {
    return DTALogic && DTALogic[k];
  }));
  ok("formulas.cbToPercent(45) === 50", DTALogic.formulas.cbToPercent(45) === 50);
  ok("formulas.mapping(5,0,10,100,80) === 90", DTALogic.formulas.mapping(5, 0, 10, 100, 80) === 90);
  ok("fechas.parseFechaHora ISO 02:46 AM -> 2 h",
    DTALogic.fechas.parseFechaHora("2026-04-25", "02:46 AM").getHours() === 2);
  ok("fechas.menorIgual dia anterior", DTALogic.fechas.menorIgual("2026-04-25", "2026-04-26") === true);
  ok("secuencias: 3 elementos", DTALogic.secuencias
    .generarSecuenciaParcelas("2026-04-25", "02:46 AM", [30, 45]).length === 3);
  ok("estado.calcStatusTime usa su update ('+1h')",
    DTALogic.estado.calcStatusTime("20260425 0246am", "20260425 0346am") === "+1h");
  ok("estado.getTimeDiference sin fecha === null (REQ-005.1)",
    DTALogic.estado.getTimeDiference(null, "20260425 0246am") === null);
  ok("estado '12pm' es mediodia (REQ-005.4)",
    new Date(DTALogic.estado.instanteDeFechaDispositivo("20260425 1200pm")).getHours() === 12);
  ok("ids.generarIdUnico devuelve cadena",
    typeof DTALogic.ids.generarIdUnico() === "string");

  var plan = {
    nombre: "QA", periodo: "0", cada: 1, fecha_inicio: "2026-04-25",
    hora_inicio: "02:46 AM", fecha_fin: "2026-04-25",
    t: [10, 20, 30, 40, 50, 60, 70]
  };
  var programado = DTALogic.riego.programar(plan, { generarId: function () { return "fijo"; } });
  ok("riego.programar: 7 entradas", programado.entradas.length === 7);
  ok("riego.programar: primera parcela a las 02:46", programado.entradas[0].time === "02:46");
  ok("riego.programar: id inyectado", programado.id === "fijo");

  // REQ-010: el repositorio construye rutas correctas, con un adaptador falso (sin red)
  var llamadasRepo = [];
  var repo = DTALogic.repositorio.crear({
    escuchar: function (r) { llamadasRepo.push(r); return function () {}; },
    escucharPorClave: function (r, c) { llamadasRepo.push(r + "#" + c); return function () {}; },
    escucharUltimos: function (r, n) { llamadasRepo.push(r + "|" + n); return function () {}; },
    leer: function (r) { llamadasRepo.push(r); return Promise.resolve(); },
    leerUltimos: function (r, n) { llamadasRepo.push(r + "|" + n); return Promise.resolve(); },
    leerRango: function (r, c, d, h) { llamadasRepo.push(r + "|" + h); return Promise.resolve(); },
    escribir: function (r) { llamadasRepo.push("set:" + r); return Promise.resolve(); },
    actualizar: function (r) { llamadasRepo.push("upd:" + r); return Promise.resolve(); },
    empujar: function (r) { llamadasRepo.push("push:" + r); return Promise.resolve(); },
    borrar: function (r) { llamadasRepo.push("del:" + r); return Promise.resolve(); }
  });
  ok("repositorio: ruta de settings", repo.escucharSistema("k", function () {}).ruta === "systems/k/settings");
  repo.escucharUltimoLog("k", "logs", function () {});
  ok("repositorio: ultimo log con limitToLast(1)", llamadasRepo.indexOf("systems/k/logs|1") >= 0);
  repo.leerLogsPorRango("k", "/logs", "2026-01-01", "2026-01-31");
  ok("repositorio: rango cerrado con \uf8ff",
    llamadasRepo[llamadasRepo.length - 1] === "systems/k/logs|2026-01-31\uf8ff");
  repo.escucharUsuarioPorClave("ana.perez@x.com", function () {});
  ok("repositorio: usuario por clave con puntos convertidos",
    llamadasRepo[llamadasRepo.length - 1] === "users#ana-perez@x-com");
  repo.escribirEstadoSistema("k", "ON");
  ok("repositorio: escritura de estado", llamadasRepo[llamadasRepo.length - 1] === "upd:systems/k/settings");

  // REQ-012: servicio de autenticacion con adaptador falso
  var sesiones = [];
  var auth = DTALogic.autenticacion.crear({
    observar: function (cb) { authEmisor = cb; },
    cerrarSesion: function () { return Promise.resolve(); }
  });
  var authEmisor = null;
  auth.observar(function (s) { sesiones.push(s); });
  authEmisor({ email: "qa@x.com" });
  authEmisor(null);
  ok("autenticacion: sesion autenticada", sesiones[0].autenticado === true);
  ok("autenticacion: sesion cerrada", sesiones[1].autenticado === false);

  // REQ-013: reglas y servicio de equipos
  ok("equipos.carpetaDeLogs('Sensor') === 'dayLogs'",
    DTALogic.equipos.carpetaDeLogs("Sensor") === "dayLogs");
  ok("equipos.etiquetaDeRetraso '+2h'",
    DTALogic.equipos.etiquetaDeRetraso(
      { update: "20260425 0246am", safety: "true", voltage: "true" },
      function () { return new Date(2026, 3, 25, 4, 46).getTime(); }) === "+2h");

  var emisorEquipos = null;
  var sistemaRecibido = null;
  var servicioEquipos = DTALogic.equiposServicio.crear({
    escucharSistema: function (clave, alCambiar) {
      emisorEquipos = alCambiar;
      return { ruta: "systems/" + clave + "/settings", off: function () {} };
    },
    escucharUsuariosSistema: function () { return { ruta: "u", off: function () {} }; },
    escucharUltimoLog: function (clave, dir) { return { ruta: "systems/" + clave + "/" + dir, off: function () {} }; }
  });
  servicioEquipos.cargar(["k"], { alCambiarSistema: function (sistema) { sistemaRecibido = sistema; } });
  emisorEquipos({ val: function () { return { name: "Equipo QA", type: "Sensor" }; } });
  ok("equiposServicio normaliza el sistema",
    sistemaRecibido && sistemaRecibido.key === "k" && sistemaRecibido.name === "Equipo QA");

  document.getElementById("salida").textContent = resultados.join(" | ");
  document.title = resultados.every(function (r) { return r.indexOf("PASS") === 0; }) ? "SMOKE OK" : "SMOKE FAIL";
</script>
</body>
</html>
